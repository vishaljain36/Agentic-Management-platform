# ==============================================================================
# Fly.io Configuration: Agentic Management Platform
# ==============================================================================

app = "agentic-workspace-api"
primary_region = "iad"

[build]
  dockerfile = "apps/agent-backend/Dockerfile"

# Process separation for FastAPI API and Celery Worker
[processes]
  web = "uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4"
  worker = "celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=4"

[env]
  PORT = "8000"
  NODE_ENV = "production"
  WEB_CONCURRENCY = "4"
  FRONTEND_URL = "https://app.agentic-void.io"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

# Zero-downtime liveness probe
[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

# Subsystem readiness probe
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

