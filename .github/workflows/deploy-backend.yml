name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent-backend/**'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/agent-backend/requirements.txt
      - name: Run PyTest
        run: |
          pytest apps/agent-backend/tests

